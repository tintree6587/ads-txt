<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코웨이 정수기 본사 다이렉트 렌탈 혜택</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px 15px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      padding: 24px 20px;
    }
    .badge {
      display: inline-block;
      background-color: #e8f3ff;
      color: #0066ff;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      line-height: 1.4;
      color: #111;
      margin-bottom: 12px;
      word-break: keep-all;
    }
    p.desc {
      font-size: 15px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 20px;
      word-break: keep-all;
    }
    .benefit-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .benefit-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
    }
    .benefit-item:last-child { margin-bottom: 0; }
    .benefit-item span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background: #0066ff;
      color: #fff;
      border-radius: 50%;
      font-size: 12px;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .cta-button {
      display: block;
      width: 100%;
      background: #0066ff;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      padding: 18px 0;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 102, 255, 0.35);
      transition: background 0.2s;
    }
    .cta-button:active {
      background: #0052cc;
    }
    .notice {
      margin-top: 16px;
      font-size: 12px;
      color: #999;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">코웨이 본사 다이렉트 프로모션</div>
    <h1>코웨이 인기 정수기<br>렌탈료 면제 & 제휴 할인 혜택</h1>
    <p class="desc">지금 신청하시면 등록비·설치비 전액 면제와 함께 이번 달 한정 최대 제휴 할인 혜택을 무료로 확인하실 수 있습니다.</p>
    
    <div class="benefit-box">
      <div class="benefit-item"><span>✓</span> 초기 설치비·등록비 전액 0원 지원</div>
      <div class="benefit-item"><span>✓</span> 제휴카드 적용 시 월 렌탈료 최대 할인</div>
      <div class="benefit-item"><span>✓</span> 맞춤형 인기 모델(아이콘/얼음) 실시간 비교</div>
    </div>

    <!-- 제휴 머천트 이동 버튼 -->
    <a href="https://watercheck.dbsn.kr" class="cta-button">
      👉 실시간 최저가 견적 무료 조회하기
    </a>

    <div class="notice">
      * 버튼 클릭 시 공식 상담 신청 페이지로 바로 이동합니다.<br>
      * 상담 완료 전까지 별도의 비용이 발생하지 않습니다.
    </div>
  </div>
</body>
</html>
