<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코웨이 스위치 정수기 렌탈 다이렉트 프로모션</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px 15px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      padding: 24px 20px;
    }
    .badge {
      display: inline-block;
      background-color: #e8f3ff;
      color: #0066ff;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      line-height: 1.4;
      color: #111;
      margin-bottom: 12px;
      word-break: keep-all;
    }
    p.desc {
      font-size: 15px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 20px;
      word-break: keep-all;
    }
    .benefit-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .benefit-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
    }
    .benefit-item:last-child { margin-bottom: 0; }
    .benefit-item span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background: #0066ff;
      color: #fff;
      border-radius: 50%;
      font-size: 12px;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .cta-button {
      display: block;
      width: 100%;
      background: #0066ff;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      padding: 18px 0;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 102, 255, 0.35);
      transition: background 0.2s;
    }
    .cta-button:active {
      background: #0052cc;
    }
    .footer-info {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #edf2f7;
      font-size: 11px;
      color: #888;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">코웨이 공식 프로모션</div>
    <h1>코웨이 스위치 정수기<br>렌탈료 전국 최저가 보장 혜택</h1>
    <p class="desc">초기 등록비·설치비 프로모션 혜택과 제휴카드 결합 시 최대 할인 조건을 실시간으로 확인해 보세요.</p>
    
    <div class="benefit-box">
      <div class="benefit-item"><span>✓</span> 코웨이 최우수 직영 특판 혜택</div>
      <div class="benefit-item"><span>✓</span> 제휴카드 이용 시 최대 23,000원 추가 할인</div>
      <div class="benefit-item"><span>✓</span> 정수기 상담 고객 대상 최고급 사은품 증정</div>
      <div class="benefit-item"><span>✓</span> 전국 빠른 안심 설치 지원</div>
    </div>

    <!-- 디비센스 머천트 연결 링크 -->
    <a href="https://watercheck.dbsn.kr" class="cta-button">
      👉 최저가 렌탈 견적 및 사은품 확인하기
    </a>

    <div class="footer-info">
      * 버튼 클릭 시 공식 상담 신청 페이지로 이동합니다.<br>
      공식 판매처 : 코웨이 햇살대리점
    </div>
  </div>
</body>
</html>
